name: Daily 4:00 AM Pray for India WhatsApp Dispatch

on:
  schedule:
    # 22:30 UTC = 04:00 AM IST (Indian Standard Time) Every Single Day
    - cron: '30 22 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions button anytime

jobs:
  dispatch_prayer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run 4:00 AM Automated Broadcaster
        env:
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          FIREBASE_BASE_URL: ${{ secrets.FIREBASE_BASE_URL }}
          FIREBASE_AUTH: ${{ secrets.FIREBASE_AUTH }}
          TARGET_PHONE_NUMBERS: ${{ secrets.TARGET_PHONE_NUMBERS }}
        run: |
          python cloud_sender.py
